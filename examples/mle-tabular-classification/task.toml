schema_version = "1.1"

[task]
name = "labelbox/mle-tabular-classification"
description = "Train on a synthetic tabular dataset and predict two regression targets plus one binary label."

[environment]
required_resources = "12vcpu+100gib+h100/2"
storage_mb = 50000
allow_internet = true

[agent]
timeout_sec = 21600

[verifier]
timeout_sec = 5400
env = []

[ground_truth]
continuous_score_epsilon = 0.05

[[outputs]]
path = "/tmp/output/submission.csv"
required = true
description = "CSV predictions for the held-out test rows with columns t1, t2, label"

[runner]
attempts = 3
turn_limit = 1500
max_ctx = 1000000
context_mode = "none"
api_model_name = "claude-opus-4-7"
required_tools = ["bash", "str_replace_editor", "tmux"]

[runner.timeouts]
setup_sec = 7200
grading_sec = 5400
tool_sec = 21600
max_episode_sec = 21600

[difficulty]
task_type = "ml"
domain = "scientific_discovery_computational_science"
reward_type = "continuous_scoring_function"
# Synthetic data generated by the task itself -> public domain dedication.
license = "CC0-1.0"
# Data is self-generated; the CC0 dedication is documented at the canonical deed.
license_source = "https://creativecommons.org/publicdomain/zero/1.0/"
